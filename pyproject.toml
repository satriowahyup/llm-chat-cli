[project]
name = "llm-chat-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "satriowahyup", email = "satriowahyuprasetyo@gmail.com" }
]
requires-python = ">=3.14"
